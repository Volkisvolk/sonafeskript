name: Build and publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build app
        run: bun run build

      # Gezielter Typecheck: blockiert nur bei Fehlern im App-Code (src/).
      # Bekannte Typprobleme in Dritt-Paketen (fehlende @types, stdlib) werden
      # bewusst nicht als Blocker gewertet, da nicht von uns behebbar.
      - name: Typecheck (application code)
        run: |
          bunx tsc --noEmit > tsc.out 2>&1 || true
          cat tsc.out
          if grep -E '^src/.*error TS' tsc.out; then
            echo "::error::TypeScript-Fehler im App-Code (src/) gefunden"
            exit 1
          fi
          echo "OK: keine Typfehler in src/"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      # Image zuerst lokal bauen (kein Push), damit es vor dem Veröffentlichen
      # gescannt werden kann. Layer werden gecacht → der Push-Build ist schnell.
      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Container-Scan: blockiert bei behebbaren CRITICAL/HIGH-Schwachstellen.
      # ignore-unfixed verhindert Blockieren durch nicht-patchbare Base-Image-CVEs.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
